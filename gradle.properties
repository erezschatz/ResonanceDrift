# Gradle daemon heap. 4 GB is comfortable for a single-module Compose app on
# both machines; raise it if builds die with OutOfMemoryError.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Build cache: rebuilds reuse outputs across branches and clean builds.
org.gradle.caching=true

# AndroidX is the only option for new projects; AGP 9 defaults this to true,
# kept explicit so the intent is visible.
android.useAndroidX=true

kotlin.code.style=official
